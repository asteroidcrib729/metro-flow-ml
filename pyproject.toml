[project]
name = "metro-flow-ml"
version = "0.1.0"
description = "Hourly traffic volume prediction, geospatial congestion visualization, and REST inference for I-94 Westbound (Minneapolis-St. Paul, MN)."
readme = "README.md"
authors = [{ name = "Faraz Hussain" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14.7,<3.15"
dependencies = [
    "fastapi>=0.165.0,<1.0.0",
    "folium>=1.0.0,<2.0.0",
    "ipykernel>=7.2.0,<8.0.0",
    "ipywidgets>=8.1.9,<9.0.0",
    "joblib>=1.6.0,<2.0.0",
    "matplotlib>=3.11.2,<4.0.0",
    "numpy>=2.5.5,<3.0.0",
    "pandas>=3.1.1,<4.0.0",
    "pydantic>=2.14.4,<3.0.0",
    "scikit-learn>=1.9.1,<2.0.0",
    "seaborn>=0.13.2,<1.0.0",
    "uvicorn>=0.54.0,<1.0.0",
    "xgboost>=3.4.1,<4.0.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=3.1.0,<4.0.0",
    "types-seaborn>=0.13.2,<1.0.0",
]
